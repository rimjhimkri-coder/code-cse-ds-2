<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function in JS</title>
</head>
<body>
    <script>
        // function: a javascript function is a reusable block of code designed to perform a specific task.

        // normal function

        function demo(){
            console.log("hello");
        } 
        demo();

        function demo1( text){
            console.log("hello " + text);
        }
        demo1("React");



        function add(a,b=10){
            console.log("addition of two number is "+(a+b));
        }
        add(5);


        // anonymous function
       // An anonymous function in JavaScript is a function that does not have an identifier (name) associated with it. 
       // They are defined using a function expression or, more commonly, the concise ES6 arrow function syntax.


        let cal=function(){
            var num1=10;
            var num2=15;
            var res=num1* num2;
            console.log("multiply of num1 and num2  is " + res);
        }
        cal();


        // arrow function 

        let div=(x,y)=>{
            var num1=x;
            var num2=y;
            var res=x/y;
            console.log( "division is " + res);

        }
        div(15,5);


        let msg=()=>console.log("hello ABES");
        msg();



        //callback function:

        function sub(callback){
            var num1=10;
            var num2=20;
            var res=num1-num2;
        }
        function displayRes( res){
            console.log("result is " +res);

        }
        sub(displayRes);



        function msg1(){
            console.log("")
        }




        //IIFE


        (function(a,b){
            console.log(`First  parameter ${a} and second parameter ${b}`);
            var res=a+b;
            console.log(`Result is ${res}`);

        } )(4,5);


        // short code using arrow function
        (msg=> console.log("HELLO IIFE"))();




        // promises
        //Promises  is an object representing the eventual completion (or failure) of an asynchronous operation and its resulting value. 

        let promise=new Promise( function (resolve , reject){
            let age=20;
            if(age=>18){
                resolve("valid age");}
                else{
                    reject( "wait for next year");
                }
                });
        console.log(promise);
        promise.then(msg=>console.log(msg)) .catch(error=>console.log());

        // async function

        //async function userData(){
          //  let response=await fetch("https://github.com/rimjhimkri-coder/code-cse-ds-2")
           // let responseData=await response.json();
           // console.log(responseData);
       // }

       // userData();

        try{
            async function userData(){
            let response=await fetch("https://github.com/rimjhimkri-coder/code-cse-ds-2")
            let responseData=await response.json();
            console.log(responseData);

        }
    }
        catch(error){
            console.log(error);

        }
    
        // local storage

        let myinfo={
            name:"john",
            age: 23,
            mob:477899000,
            email:"john@gmail.com"
        }
// convert object to string using stringfy
        let myinfoData=JSON.stringify(myinfo);

        //set data
        localStorage.setItem('preference',myinfoData);

        //retrieving and parsing the object back
        let getmyinfoloData=localStorage.getItem('preference');

        //prase the object
        const finalData=JSON.parse(getmyinfoloData);
        console.log(finalData.name);

        //Array

        let num=[3,5,6,7,8,9];
        let result=num.map(n=>n*n);
        console.log(`square of num is ${result}`);

        let result2=num.filter(n=>n>3);
        console.log(`sorting of num array  is${result2}`);
        



    </script>
    
</body>
